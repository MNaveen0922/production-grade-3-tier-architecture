# SonarQube project configuration
# https://docs.sonarsource.com/sonarqube-server/analyzing-source-code/analysis-parameters/

sonar.projectKey=support-desk-platform
sonar.projectName=Support Desk Platform
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# Sources & tests
# ---------------------------------------------------------------------------
# All application code lives under app/<service>/. Each Python service is its
# own module (own venv/dependencies) but we scan them together as one project
# with per-module coverage reports below.
sonar.sources=app
sonar.tests=app/auth/tests,app/ticket/tests,app/assignment/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.min.js,**/__pycache__/**
sonar.test.exclusions=**/node_modules/**

# ---------------------------------------------------------------------------
# Python (auth, ticket, assignment, worker)
# ---------------------------------------------------------------------------
sonar.python.version=3.11
# One coverage.xml per service, produced by the "unit-test" CI job and
# downloaded into these paths before the scan step runs.
sonar.python.coverage.reportPaths=\
  coverage-reports/coverage-auth.xml,\
  coverage-reports/coverage-ticket.xml,\
  coverage-reports/coverage-assignment.xml

# ---------------------------------------------------------------------------
# JavaScript / React frontend
# ---------------------------------------------------------------------------
sonar.javascript.file.suffixes=.js,.jsx
# No JS test suite exists yet - remove/point this at real lcov output once one
# is added (e.g. vitest --coverage).
# sonar.javascript.lcov.reportPaths=app/frontend/coverage/lcov.info
