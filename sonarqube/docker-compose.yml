# Quick-start SonarQube Server for the support-desk-platform project.
#
# This is meant to get a working SonarQube instance up fast so the CI
# integration in .github/workflows/application.yml has something to talk to.
# For a long-lived/production instance, put this behind HTTPS (reverse proxy
# or ALB) and back it with managed Postgres (e.g. RDS, since this repo
# already provisions RDS via Terraform) instead of the local `db` container.
#
# Usage:
#   cd sonarqube
#   docker compose up -d
#   open http://localhost:9000   (default login: admin / admin — you'll be
#                                  forced to change it on first login)
#
# Then, in SonarQube: My Account > Security > Generate Token, and add these
# two secrets to your GitHub repo (Settings > Secrets and variables > Actions):
#   SONAR_HOST_URL = http://<your-server-address>:9000
#   SONAR_TOKEN    = <the generated token>
#
# Note: GitHub-hosted runners need network access to SONAR_HOST_URL. If this
# server only runs on localhost/private network, either expose it (e.g. via
# the ALB this project already sets up) or switch the CI job to a
# self-hosted runner that can reach it.

version: "3.8"

services:
  sonarqube:
    image: sonarqube:10-community
    container_name: sonarqube
    depends_on:
      - db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  db:
    image: postgres:15
    container_name: sonarqube_db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_db_data:
